name: Verify
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: qa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U qa -d qa_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://qa:ci-only@127.0.0.1:5432/qa_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            web/package-lock.json
      - name: Install browser worker
        working-directory: worker
        run: npm ci && npx playwright install --with-deps chromium
      - name: Install web workspace
        working-directory: web
        run: npm ci
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Install pinned OpenCode runtime for synthetic integration
        run: node scripts/install-opencode.mjs
      - name: Test Go against PostgreSQL
        run: go test -race ./... && go vet ./...
      - name: Check browser worker and synthetic sample
        run: cd worker && npm run check && npm test
      - name: Build web workspace
        run: cd web && npm run build
      - name: Prove the complete release path
        run: node scripts/integration.mjs
      - name: Preserve synthetic verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: correctness-proof
          retention-days: 7
          path: |
            artifacts/integration-*/observations.json
            artifacts/integration-*/manifest.json
            artifacts/integration-*/cli.txt
            artifacts/integration-*/release-*.json
            artifacts/integration-*/release-desktop.png
            artifacts/integration-*/release-mobile.png
            artifacts/integration-*/chatgpt-subscription-*.png
            artifacts/integration-*/anthropic-provider-*.png
            artifacts/integration-*/google-provider-*.png
            artifacts/integration-*/opencode-provider-*.png
