name: qa-agent
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa-local-only
      POSTGRES_DB: qa_agent
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - qa-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U qa -d qa_agent"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  qa-data:
